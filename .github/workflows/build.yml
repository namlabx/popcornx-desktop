name: Latest Build

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        nwjs: ['0.44.5', '0.86.0']

    steps:
      - name: Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: yarn version
        run: |
          yarn version

      - name: node version
        run: |
          node --version

      - name: Set platform
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  echo "platform=linux64"  >> "$GITHUB_ENV" ;;
            macOS-latest)   echo "platform=osx64"    >> "$GITHUB_ENV" ;;
            windows-latest) echo "platform=win64"    >> "$GITHUB_ENV" ;;
          esac

      - name: Build info
        run: echo Build ${{ env.platform }} on nw-v${{ matrix.nwjs }}

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          choco install nsis
          echo "C:/Program Files (x86)/NSIS" >> $GITHUB_PATH

      - name: Build App
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        shell: bash
        run: |
          yarn
          mirrors=(
            "https://popcorn-time.serv00.net/nw/"
            "https://dl.nwjs.io"
            "https://npmmirror.com/mirrors/nwjs"
          )
          success=false
          for i in {1..3}; do
            mirror="${mirrors[$((i-1 < ${#mirrors[@]} ? i-1 : ${#mirrors[@]}-1))]}"
            echo "Attempt $i of 3 (mirror: $mirror)..."
            if [ $i -gt 1 ]; then rm -rf cache; fi
            rm -rf build
            if yarn gulp dist --platforms=${{ env.platform == 'win' && '"' || '' }}${{ env.platform }}${{ env.platform == 'win' && '"' || '' }} --nwVersion=${{ matrix.nwjs }} --downloadUrl="$mirror"; then
              success=true
              break
            fi
            echo "Attempt $i failed."
            [ $i -lt 3 ] && sleep 30
          done
          [ "$success" = "true" ] || { echo "::error::Build failed after 3 attempts"; exit 1; }
      - name: Upload artifacts
        uses: actions/upload-artifact@master
        with:
          name: ${{ env.platform }}-${{ matrix.nwjs }}
          path: build

  # -------------------------------------------------------
  # Separate job for osxarm64 (Apple Silicon)
  # Runs only on nw 0.86.0 since that's the first version
  # with official osx-arm64 binaries.
  # Uses ditto instead of gulp-zip to preserve .app symlinks.
  # -------------------------------------------------------
  build-osxarm64:
    name: Build (osxarm64)
    runs-on: macos-14

    steps:
      - name: Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore nwjs arm64 cache
        id: nwjs-arm64-cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: nwjs-sdk-osxarm64-0.86.0

      - name: Build App (osxarm64)
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        shell: bash
        run: |
          yarn
          yarn gulp injectgit css --platforms=osx64
          APP_VER=$(node -e "const g=require('./git.json'); console.log(g.semver)" 2>/dev/null || node -e "console.log(require('./package.json').version)")

          mirrors=(
            "https://popcorn-time.serv00.net/nw/"
            "https://dl.nwjs.io"
            "https://npmmirror.com/mirrors/nwjs"
          )
          success=false
          for i in {1..3}; do
            mirror="${mirrors[$((i-1 < ${#mirrors[@]} ? i-1 : ${#mirrors[@]}-1))]}"
            echo "Attempt $i of 3 (mirror: $mirror)..."
            if [ $i -gt 1 ]; then rm -rf cache; fi
            rm -rf build
            if bash dist/mac/make-osxarm64.sh "0.86.0" build Popcorn-Time "${APP_VER}" "$mirror"; then
              success=true
              break
            fi
            echo "Attempt $i failed."
            [ $i -lt 3 ] && sleep 30
          done
          [ "$success" = "true" ] || { echo "::error::osxarm64 build failed after 3 attempts"; exit 1; }

      - name: Save nwjs arm64 cache
        if: success() && steps.nwjs-arm64-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: nwjs-sdk-osxarm64-0.86.0

      - name: Upload artifacts
        uses: actions/upload-artifact@master
        with:
          name: osxarm64-0.86.0
          path: build

  packs:
    needs: [build, build-osxarm64]
    name: Packs
    runs-on: ubuntu-latest

    strategy:
      matrix:
        nwjs: ['0.44.5', '0.86.0']

    steps:
      - name: Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/checkout@v4
        with:
          path: repo
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: linux64-${{ matrix.nwjs }}
          path: .

      - name: Install packages and appimagetool
        run: |
          sudo apt update
          sudo apt install -y libfuse2
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          VER=$(ls *-linux64*.zip | sed 's/-linux64.*//')
          echo $VER
          unzip -q *-linux64*.zip -d $VER.AppDir
          cp repo/dist/linux/appimage/* $VER.AppDir/
          ln -s Popcorn-Time $VER.AppDir/AppRun
          mkdir build
          ARCH=x86_64 ./appimagetool-x86_64.AppImage $VER.AppDir build/$VER-linux64${{ matrix.nwjs == '0.44.5' && '-0.44.5' || '' }}.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@master
        with:
          name: linux64-${{ matrix.nwjs }}.AppImage
          path: build


  release:
    needs: packs
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Context
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          allowUpdates: true
          name: ${{ github.ref_name }}
          artifacts: "artifacts/*"
